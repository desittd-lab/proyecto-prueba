name: Compilar ProyectaTV

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows 11 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar ejecutable único
        shell: pwsh
        run: >
          dotnet publish windows/ProyectaTV/ProyectaTV.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o out/windows

      - uses: actions/upload-artifact@v4
        with:
          name: ProyectaTV-Windows
          path: out/windows/ProyectaTV.exe

  android:
    name: Android TV (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: android-tv
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp android-tv/app/build/outputs/apk/debug/app-debug.apk ProyectaTV-Receptor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProyectaTV-AndroidTV
          path: ProyectaTV-Receptor.apk

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ProyectaTV.exe
            dist/ProyectaTV-Receptor.apk
